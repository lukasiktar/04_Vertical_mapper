# Platform config: Jetson Orin Nano 8 GB (JetPack 6.1/6.2, CPU+GPU share the 8 GB).
# Selected with `platform:=orin_nano`. Same keys as laptop.yaml; lighter values.

# Depth limit [m] for everything that builds geometry: RTAB-Map grid/cloud (Grid/RangeMax),
# nvblox integration range, the RViz map cloud and the default of export_map.sh. 0 = no limit.
# The camera, the raw bags and the database keep FULL depth, so this can be changed later.
# cuVSLAM is stereo-based and not affected. Features for loop closure are limited separately
# (rtabmap.features_max_depth).
depth_max_m: 3.0

camera:
  serial_no: ''
  usb_port_id: ''
  depth_width: 848
  depth_height: 480
  depth_fps: 30               # 15 is the low-load option (cuVSLAM then gets only 7.5 Hz IR
                              # with interleave, which is marginal for tracking; prefer 30)
  color_width: 640
  color_height: 480
  color_fps: 30               # = depth_fps, keep it so. Aligned depth is paired with the nearest
                              # color frame and RTAB-Map only gets the emitter-ON half; at 15 fps
                              # color the pairing drifts between ON and OFF depth frames (separate
                              # sensor clocks), so RTAB-Map got no depth ~60 s of every ~120 s
                              # (measured 2026-11-05: 37 keyframes in a 642 s map)
  gyro_fps: 200
  accel_fps: 200
  emitter_on_off: true
  invert_emitter_mode: true   # same camera + firmware as on the laptop (see laptop.yaml)
  initial_reset: false

base_to_camera:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# PX4 + cuVSLAM odometry fusion: `scripts/map.sh <name> <platform> fuse_px4:=true` (same for
# localize.sh). Needs `ros2 run vanguard px4_odom_bridge` in the vanguard_ros2 container
# (-> /px4/odom). JETSON_QUICKSTART.md "2b".
px4_fusion:
  # Camera mounting in the PX4 body frame, used instead of base_to_camera with fuse_px4:=true or
  # px4_vio:=true so that base_link = PX4 body (x forward, y left, z up [m]; roll pitch yaw [rad],
  # pitch + = looking down). xyz from calibrate_rig.sh on stup_indoor_1 (checked with a ruler);
  # rpy from PX4 gyro vs cuVSLAM rotation, hand test 2026-11-04 (was -0.0059 0.1105 -0.0383 from
  # calibrate_rig.sh, 2.3 deg off). Redo both if the mount moved.
  # 2026-11-13: rpy redone, PX4 gyro vs cuVSLAM rotation (bags cam_run1/2: pitch 13 deg off the
  # 2026-11-04 value; OptiTrack hand-eye handeye_run1 agrees, -13.9 deg). Was 0.0005 0.1324 -0.0045.
  # xyz redone 2026-11-13 from OptiTrack hand-eye (handeye_run1: camera rel. pivot 0.119 0.043 -0.045,
  # about 1.5 cm scatter) minus the IMU rel. pivot from the lever-arm fit (leverarm_run1/2: -0.005
  # -0.009 0.004 in FLU). ASSUMES those lever-arm bags were recorded with the current Motive pivot;
  # if not, redo the lever-arm run. Was 0.144 -0.021 0.023 (ruler / calibrate_rig.sh).
  base_to_camera:
    xyz: [0.124, 0.052, -0.049]
    rpy: [-0.0004, 0.3601, -0.0160]
  ekf_rate_hz: 50.0
  vslam_linear_variance: 0.0025    # (5 cm/s)^2: cuVSLAM velocity between two poses
  vslam_angular_variance: 0.0025   # (3 deg/s)^2
  vslam_rejection_threshold: 5.0   # sigmas: a cuVSLAM velocity this far from the EKF's is dropped
  vslam_max_speed: 5.0             # m/s between two poses; faster = a jump, dropped
  vslam_max_rate: 6.0              # rad/s, same
  vslam_resume_skip: 5             # poses dropped after cuVSLAM regains tracking

# cuVSLAM -> PX4 EKF2 as external vision: `ros2 launch d455_mapping vslam.launch.py
# platform:=<platform> px4_vio:=true` (or map.sh / localize.sh ... px4_vio:=true). Needs
# `ros2 run vanguard vslam_to_px4_node` in the vanguard_ros2 container. Uses
# px4_fusion.base_to_camera. JETSON_QUICKSTART.md "2c".
px4_vio:
  position_variance: 0.01          # (10 cm)^2; PX4 uses max(this, EKF2_EVP_NOISE^2)
  orientation_variance: 0.01       # (0.1 rad)^2; PX4 uses max(this, EKF2_EVA_NOISE^2)
  max_speed: 5.0                   # m/s between two poses; faster = a jump, dropped
  max_rate: 6.0                    # rad/s, same
  resume_skip: 5                   # poses dropped after cuVSLAM regains tracking

vslam:
  enable_imu_fusion: true
  image_jitter_threshold_ms: 0.0
  enable_observations_view: false  # no debug clouds over Wi-Fi
  verbosity: 1

rtabmap:
  features_max_depth: 0.0          # Kp/MaxDepth + Vis/MaxDepth [m]; 0 = off. Using the depth limit here
                                   # too also drops far features for loop closure (can weaken loop
                                   # closures and relocalization in big rooms; map and localize with
                                   # the same value)
  odom_source: tf
  odom_linear_variance: 0.001
  odom_angular_variance: 0.001
  detection_rate: 1.0
  kp_max_features: 400
  vis_max_features: 600
  stm_size: 20
  linear_update: 0.1
  angular_update: 0.1
  grid_cell_size: 0.1
  cloud_decimation: 4
  use_imu: true
  queue_size: 20

nvblox:
  enable: false                    # off by default: shares the 8 GB with everything else
  voxel_size: 0.10
  map_clearing_radius_m: 6.0       # bound memory: drop blocks > 6 m from the camera
  integrate_depth_rate_hz: 10.0
  integrate_color_rate_hz: 2.0
  update_mesh_rate_hz: 1.0
  publish_layer_rate_hz: 1.0

cross_detector:                    # cross detector (README "Cross detection"); overrides config/cross_detector.yaml
  process_every_n: 3                 # 15 Hz synced frames -> 5 Hz detection
  detect_scale: 0.5                # RGB detection resolution factor (pixel parameters stay full-resolution)
  max_segments: 50               # longest line segments that are paired (cost grows with the square)

rviz:
  show_prior_map: false              # localize.sh also shows the saved cloud (whole map) in RViz
  enable: false                    # RViz runs on the laptop (docs/JETSON.md)
  config_suffix: '_remote'

record:
  max_bag_size_bytes: 0
  compression: ''
